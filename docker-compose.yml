# Local development only. These credentials never leave your machine.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pitchdex
      POSTGRES_USER: pitchdex
      POSTGRES_PASSWORD: pitchdex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchdex -d pitchdex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
