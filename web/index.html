<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitchdex</title>
    <script>
      // Light or dark before the first paint, so the page doesn't flash. Matches src/lib/theme.ts.
      try {
        var pick = localStorage.getItem("pitchdex.theme")
      } catch (e) {}
      if (
        pick === "dark" ||
        (pick !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
